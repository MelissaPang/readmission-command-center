bundle:
  name: readmission-command-center

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the solution
    default: cedarbrook_rcc
  warehouse_id:
    description: Serverless SQL warehouse used by the dashboard, Genie, and the app
    default: 12444b712298f9ac
  lakebase_instance:
    description: Lakebase (provisioned Postgres) instance
    default: rcc-lakebase
  lakebase_database:
    description: Postgres database inside the Lakebase instance
    default: rcc
  extraction_endpoint:
    description: Foundation Model endpoint used by AI Functions on discharge notes
    default: databricks-claude-haiku-4-5
  assistant_endpoint:
    description: Foundation Model endpoint used by the app to draft transition plans
    default: databricks-claude-sonnet-4-6

targets:
  dev:
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
